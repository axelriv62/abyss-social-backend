info:
  name: Comment a post
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/posts/69cd1b0f772d9b831ad8f4ce/comments"
  body:
    type: json
    data: |-
      {
        "text" : "Super ! Qu'en as-tu pensé ?",
        "postId": "69cd1b0f772d9b831ad8f4ce"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
