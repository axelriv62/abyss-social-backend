info:
  name: Generate profile picture for current user
  type: http
  seq: 7

http:
  method: POST
  url: "{{URL}}/generate/profile-picture"
  body:
    type: json
    data: |-
      {
        "prompt": "image"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
