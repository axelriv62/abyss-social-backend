info:
  name: Save post with id
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/posts"
  body:
    type: json
    data: |-
      {
        "content": "Première plongée de l'année effectuée à Roeux",
        "comments": [],
        "likes": [],
        "dislikes": []
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
