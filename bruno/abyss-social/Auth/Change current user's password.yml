info:
  name: Change current user's password
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{URL}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "newPassword": "tresgrossecret"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
